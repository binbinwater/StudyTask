{% extends "base.html" %}
{% block title %}确认删除 · StudyTask{% endblock %}

{% block content %}
  <div class="breadcrumb">
    <a href="{{ url_for('tasks.index') }}">任务列表</a>
    <span aria-hidden="true">/</span>
    <a href="{{ url_for('tasks.detail', task_id=task.id) }}">{{ task.name }}</a>
    <span aria-hidden="true">/</span>
    <span>确认删除</span>
  </div>

  <section class="panel confirm-panel">
    <p class="eyebrow">删除确认</p>
    <h1>确定要删除这项任务吗？</h1>
    <div class="confirm-task">
      <strong>{{ task.name }}</strong>
      <span class="muted">{{ task.course }} · 截止日期 {{ task.due_date }}</span>
    </div>
    <p class="warning-text">删除后任务记录将从数据库永久移除，无法恢复。</p>
    <form method="post" action="{{ url_for('tasks.delete', task_id=task.id) }}" class="form-actions">
      <button class="button button-danger" type="submit">确认删除</button>
      <a class="button button-ghost" href="{{ url_for('tasks.detail', task_id=task.id) }}">取消</a>
    </form>
  </section>
{% endblock %}
