<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StudyTask 学习任务管理{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('tasks.index') }}">
        <span class="brand-mark">ST</span>
        <span>
          <strong>StudyTask</strong>
          <small>个人学习任务管理</small>
        </span>
      </a>
      <nav class="main-nav" aria-label="主导航">
        <a href="{{ url_for('tasks.index') }}">任务列表</a>
        <a class="button button-primary button-small" href="{{ url_for('tasks.new_task') }}">+ 新建任务</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack" aria-live="polite">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">StudyTask · 本地单用户学习任务管理</div>
  </footer>
</body>
</html>
